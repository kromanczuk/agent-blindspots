[project]
name = "agent-blindspots"
version = "1.0.0"
description = "Do AI checkers catch the mistakes AI agents actually make? Planted vs. real errors on tau2-bench retail."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kuba Romanczuk" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]

[project.scripts]
blindspots = "blindspots.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blindspots"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Prompts are kept verbatim as they were run, including line length and %-formatting.
"src/blindspots/prompts.py" = ["E501", "UP031"]
